name: Cleanup external merge fix diff

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev_lcc'
    runs-on: windows-latest
    steps:
      - name: Checkout dev_lcc
        uses: actions/checkout@v4
        with:
          ref: dev_lcc
          fetch-depth: 0

      - name: Restore unrelated formatting changes
        shell: pwsh
        run: |
          git checkout 1dfe37231f3a267d7248d4d1565ea585d67a04df -- src/bin/khaslana_updater.rs src/tests/update.rs src/update.rs src/main.rs

          @'
          import re
          from pathlib import Path

          main_path = Path('src/main.rs')
          main = main_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(FieldId::ExternalMergeIntellijPath\) \{\s*'
              r'if self\.active_dialog == Some\(DialogState::ExternalMergeSettings\) \{\s*)'
              r'self\.save_external_merge_settings_from_form\(\);'
          )
          main, replacements = pattern.subn(
              r'\1self.save_external_merge_settings_from_form_and_resume();',
              main,
              count=1,
          )
          if replacements != 1:
              raise RuntimeError('external merge submit call changed unexpectedly')
          main_path.write_text(main, encoding='utf-8')

          workflow = Path('.github/workflows/cleanup-external-merge-fix.yml')
          if workflow.exists():
              workflow.unlink()
          '@ | python -

      - name: Compile check
        shell: pwsh
        run: cargo check --bin khaslana

      - name: Commit focused diff
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep external merge fix focused"
          git push origin HEAD:dev_lcc
