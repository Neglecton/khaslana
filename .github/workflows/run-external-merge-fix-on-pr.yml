name: Run external merge fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev_lcc'
    runs-on: windows-latest
    steps:
      - name: Checkout dev_lcc
        uses: actions/checkout@v4
        with:
          ref: dev_lcc
          fetch-depth: 0

      - name: Run embedded patch
        shell: pwsh
        run: |
          @'
          import re
          import traceback
          from pathlib import Path

          try:
              workflow = Path('.github/workflows/fix-external-merge-flow.yml').read_text(encoding='utf-8')
              match = re.search(r"@'\n(?P<script>.*)\n\s*'@ \| python -", workflow, re.S)
              if not match:
                  raise RuntimeError('embedded patch script was not found')

              inside_triple_string = False
              script_lines = []
              for line in match.group('script').splitlines():
                  processed = line if inside_triple_string else (
                      line[10:] if line.startswith('          ') else line
                  )
                  script_lines.append(processed)
                  if processed.count("'''") % 2 == 1:
                      inside_triple_string = not inside_triple_string
              script = '\n'.join(script_lines)
              exec(compile(script, '<external-merge-fix>', 'exec'))

              trigger = Path('.github/workflows/run-external-merge-fix-on-pr.yml')
              if trigger.exists():
                  trigger.unlink()
          except BaseException:
              Path('external-merge-fix-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          '@ | python -

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-merge-fix-error
          path: external-merge-fix-error.txt
          if-no-files-found: error

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Verify formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Compile check
        shell: pwsh
        run: cargo check --bin khaslana

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: guide external merge tool configuration"
          git push origin HEAD:dev_lcc
