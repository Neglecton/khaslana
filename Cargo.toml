[package]
name = "khaslana"
version = "1.0.9"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
chardetng = "1"
directories = "6"
encoding_rs = "0.8"
git2 = { version = "0.21", features = ["https", "ssh"] }
gpui = { package = "gpui-ce", version = "0.3" }
json5 = "1"
keyring = "4"
keyring-core = "1"
bstr = "1"
getrandom = "0.3"
lru = "0.18"
# Markdown 解析（AI 评审结果等富文本展示）；只需 parser，关掉默认的 html 渲染器。
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
regex = "1"
semver = "1"
sha2 = "0.11"
zip = "8"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
# 语法高亮：纯 Rust 后端（fancy-regex，免 oniguruma C 依赖），内置默认语法与主题 dump；
# 用于追溯/浏览内容/冲突工作台/diff 全文视图的只读代码着色。
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# AI 功能用的轻量同步 HTTP 客户端；后台线程阻塞调用，避免引入 async runtime。
# socks-proxy 让 OAuth/AI/更新请求跟随用户的 SOCKS5 代理设置，缺失时 SOCKS 代理会静默退化为直连。
ureq = { version = "3", features = ["json", "socks-proxy"] }
unicode-segmentation = "1"
# 0.3 改为 headless + renderer 架构（component 模块移除、Theme 结构重排），
# 升级需重写组件接入层，暂留 0.2 系最新版本。
yororen_ui = "0.2"

[target.'cfg(windows)'.dependencies]
# git2 0.21 尚未暴露跳过被占用目录的 checkout 选项，Windows 工作区操作需直接配置 libgit2。
libgit2-sys = "0.18"
raw-window-handle = "0.6"
tray-icon = { version = "0.24.2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"

[profile.release-perf]
inherits = "release"
lto = "fat"           # 启用高效的跨 Crate 全局优化
codegen-units = 1     # 舍弃编译速度，换取极致的代码优化和体积缩减
